function stopByNo(n){return STOPS[n-1]}
function effectiveCoord(s){const v=state.verified[s.stop];return v?[v.lat,v.lon]:[s.lat,s.lon]}
function haversine(a,b){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]);const x=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmtDistance(m){return m<1000?Math.round(m)+" m away":(m/1000).toFixed(2)+" km away"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
let userLatLng=null;
function redrawRoute(){}
function redrawMarkers(){}
function fitAll(){}
function renderList(filter=""){const q=filter.trim().toLowerCase(),list=document.getElementById("list");list.innerHTML="";STOPS.filter(s=>!q||(s.stop+" "+s.name+" "+s.postcode).toLowerCase().includes(q)).forEach(s=>{const d=document.createElement("div");d.className="row"+(s.stop===state.currentStop?" active":"")+(state.completed[s.stop]?" done":"");d.innerHTML='<div class="num">'+s.stop+'</div><div><div class="name">'+esc(s.name)+'</div><div class="postcode">'+esc(s.postcode)+'</div></div><div class="vmark">'+(state.verified[s.stop]?"📍":"")+(state.completed[s.stop]?" ✓":"")+"</div>";d.onclick=()=>setCurrent(s.stop,true);list.appendChild(d)})}
function renderCurrent(){const s=stopByNo(state.currentStop);document.getElementById("stopTitle").textContent=s.stop+". "+s.name;document.getElementById("stopMeta").textContent=s.postcode+" · initial confidence: "+s.confidence;const b=['<span class="badge">'+esc(s.confidence)+' initial</span>'];if(state.verified[s.stop])b.push('<span class="badge verified">📍 GPS verified</span>');if(state.completed[s.stop])b.push('<span class="badge complete">✓ completed</span>');document.getElementById("badges").innerHTML=b.join("");document.getElementById("prevBtn").disabled=s.stop===1;document.getElementById("nextBtn").disabled=s.stop===STOPS.length;document.getElementById("verifyBtn").disabled=!userLatLng;document.getElementById("clearVerifiedBtn").disabled=!state.verified[s.stop];document.getElementById("completeBtn").textContent=state.completed[s.stop]?"Undo completed":"✓ Complete & go to next";updateDistance()}
function updateDistance(){const e=document.getElementById("distance");if(!userLatLng){e.textContent="Waiting for GPS…";return}const c=effectiveCoord(stopByNo(state.currentStop)),d=haversine([userLatLng.lat,userLatLng.lng],c),a=userLatLng.accuracy?" · GPS ±"+Math.round(userLatLng.accuracy)+" m":"";e.textContent=fmtDistance(d)+a}
function setCurrent(n){
  const target=Math.max(1,Math.min(STOPS.length,Number(n)));
  if(target===state.currentStop)return;
  state.currentStop=target;
  save();
  renderCurrent();
  renderList(document.getElementById("search").value);
}
function bindPress(id,fn){
  const el=document.getElementById(id);
  let last=0;
  const run=e=>{
    if(e){e.preventDefault();e.stopPropagation();}
    const now=Date.now();
    if(now-last<180)return;
    last=now;
    fn();
  };
  if(window.PointerEvent) el.addEventListener("pointerup",run,{passive:false});
  else el.addEventListener("touchend",run,{passive:false});
  el.addEventListener("click",e=>{
    if(Date.now()-last<500){e.preventDefault();return;}
    run(e);
  });
}
bindPress("prevBtn",()=>setCurrent(state.currentStop-1));
bindPress("nextBtn",()=>setCurrent(state.currentStop+1));
document.getElementById("verifyBtn").onclick=()=>{if(!userLatLng)return;const s=stopByNo(state.currentStop);state.verified[s.stop]={lat:Number(userLatLng.lat.toFixed(7)),lon:Number(userLatLng.lng.toFixed(7)),accuracy:userLatLng.accuracy?Math.round(userLatLng.accuracy):null,verifiedAt:new Date().toISOString()};save();redrawRoute();redrawMarkers();renderCurrent();renderList(document.getElementById("search").value)};
document.getElementById("clearVerifiedBtn").onclick=()=>{delete state.verified[state.currentStop];save();redrawRoute();redrawMarkers();renderCurrent();renderList(document.getElementById("search").value)};
document.getElementById("completeBtn").onclick=()=>{const n=state.currentStop;if(state.completed[n])delete state.completed[n];else state.completed[n]=new Date().toISOString();save();if(state.completed[n]&&n<STOPS.length)setCurrent(n+1,true);else{redrawMarkers();renderCurrent();renderList(document.getElementById("search").value)}};
document.getElementById("mapsBtn").onclick=()=>{const c=effectiveCoord(stopByNo(state.currentStop));window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c[0]+","+c[1]),"_blank")};
document.getElementById("search").addEventListener("input",e=>renderList(e.target.value));
document.getElementById("exportBtn").onclick=()=>{const cols=["Stop","Property","Postcode","Initial Latitude","Initial Longitude","Initial Confidence","Verified Latitude","Verified Longitude","GPS Accuracy Metres","Verified At","Completed At"],csv=[cols.join(",")],q=v=>'"'+String(v??"").replaceAll('"','""')+'"';STOPS.forEach(s=>{const v=state.verified[s.stop]||{};csv.push([s.stop,q(s.name),q(s.postcode),s.lat,s.lon,q(s.confidence),v.lat??"",v.lon??"",v.accuracy??"",q(v.verifiedAt||""),q(state.completed[s.stop]||"")].join(","))});const blob=new Blob([csv.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="moelfre_route_progress.csv";a.click();URL.revokeObjectURL(a.href)};
function handlePosition(pos){
  userLatLng={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
  document.getElementById("gpsStatus").textContent="GPS: ±"+Math.round(pos.coords.accuracy)+" m";
  renderCurrent();
}
function handleGpsError(err){document.getElementById("gpsStatus").textContent="GPS unavailable";console.warn(err)}
if("geolocation"in navigator)navigator.geolocation.watchPosition(handlePosition,handleGpsError,{enableHighAccuracy:true,maximumAge:3000,timeout:15000});else handleGpsError({message:"Geolocation not supported"});
renderCurrent();renderList();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
